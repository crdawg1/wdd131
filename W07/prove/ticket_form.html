<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Ticket</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Event Ticket</h1>
 
    <form id="ticketForm" novalidate>
      <div class="field">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" name="firstName" autocomplete="given-name">
      </div>
 
      <div class="field">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" name="lastName" autocomplete="family-name">
      </div>
 
      <div class="field full">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email">
      </div>
 
      <div class="field">
        <label for="attendeeType">Type</label>
        <select id="attendeeType" name="attendeeType">
          <option value="">Choose one</option>
          <option value="student">Student</option>
          <option value="guest">Guest</option>
        </select>
      </div>
 
      <div class="field">
        <label for="eventDate">Event Date</label>
        <input type="date" id="eventDate" name="eventDate">
      </div>
 
      <div id="extraField" class="field full hidden">
        <label for="extraInput" id="extraLabel"></label>
        <input type="text" id="extraInput" name="extraInput" autocomplete="off">
      </div>
 
      <button type="submit" class="full">Create Ticket</button>
    </form>
 
    <div id="errors" class="errors" role="alert" aria-live="polite"></div>
    <section id="ticket" class="ticket hidden" aria-live="polite"></section>
  </main>
</body>
</html>
