<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snortleblat | Character Card</title>

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Snortleblat | Character Card">
  <meta property="og:description" content="Meet Snortleblat, a Swamp Beast Diplomat.">
  <meta property="og:url" content="https://crdawg1.github.io/wdd131/charactercard/">
  <meta property="og:image" content="https://andejuli.github.io/wdd131/character_card/snortleblat.webp">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Snortleblat | Character Card">
  <meta name="twitter:description" content="Meet Snortleblat, a Swamp Beast Diplomat.">
  <meta name="twitter:image" content="https://andejuli.github.io/wdd131/character_card/snortleblat.webp">

  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <article class="card" aria-labelledby="character-name">
      <img
        class="image"
        id="character-image"
        src="https://andejuli.github.io/wdd131/character_card/snortleblat.webp"
        alt="Snortleblat, a reptilian swamp beast standing in a misty forest."
        width="800"
        height="800"
      >

      <h1 class="name" id="character-name">Snortleblat</h1>

      <div class="stats">
        <p><strong>Class:</strong> <span id="character-class">Swamp Beast Diplomat</span></p>
        <p><strong>Level:</strong> <span id="character-level">5</span></p>
        <p><strong>Health:</strong> <span id="character-health">100</span></p>
      </div>

      <div class="buttons">
        <button id="attack-button" type="button">Attacked</button>
        <button id="level-up-button" type="button">Level Up</button>
      </div>

      <p class="status" id="character-status" role="status" aria-live="polite"></p>
    </article>
  </main>
</body>
</html>
